<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>md hower</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F5F2EB; --surface: #FDFAF5; --border: #D8D0C0;
  --text: #1A1714; --muted: #8A8070; --accent: #2D2420;
  --c1: #C04C1E; --c1-bg: #FEF3EE; --c1-mid: #F0C4AE;
  --c2: #1A4FA8; --c2-bg: #EEF4FE; --c2-mid: #B0C8F0;
  --c3: #9A6B0A; --c3-bg: #FEF9EE; --c3-mid: #F0DFA8;
  --c4: #3D6B3A; --c4-bg: #EEF6ED; --c4-mid: #AEDAAC;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'DM Mono', monospace; background: var(--bg); color: var(--text); min-height: 100vh; }

/* LOGIN SCREEN */
#login-screen {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2rem;
  padding: 2rem;
}
.login-logo { font-family: 'DM Serif Display', serif; font-size: 3rem; letter-spacing: -0.02em; color: var(--accent); }
.login-logo span { font-style: italic; color: var(--c1); }
.login-sub { font-size: 12px; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; }
.google-btn {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 24px;
  border: 1.5px solid var(--border);
  border-radius: 6px;
  background: var(--surface);
  font-family: 'DM Mono', monospace;
  font-size: 13px;
  color: var(--text);
  cursor: pointer;
  transition: all .15s;
  letter-spacing: 0.03em;
}
.google-btn:hover { border-color: var(--accent); box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
.google-btn svg { width: 20px; height: 20px; flex-shrink: 0; }

/* APP */
#app { display: none; padding: 2rem 1.5rem 4rem; }

header { max-width: 980px; margin: 0 auto 2rem; display: flex; align-items: flex-end; justify-content: space-between; border-bottom: 1.5px solid var(--border); padding-bottom: 1rem; flex-wrap: wrap; gap: 10px; }
.logo { font-family: 'DM Serif Display', serif; font-size: 2rem; letter-spacing: -0.02em; line-height: 1; color: var(--accent); }
.logo span { font-style: italic; color: var(--c1); }
.header-right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.date-display { font-size: 11px; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; }
.header-btns { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.user-info { font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.user-avatar { width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--border); }
.sync-status { font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 5px; }
.sync-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); transition: background .3s; }
.sync-dot.ok { background: var(--c4); }
.sync-dot.err { background: var(--c1); }
.sync-dot.loading { background: var(--c3); animation: pulse .8s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
.hdr-btn { font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; padding: 5px 14px; border: 1px solid var(--border); border-radius: 3px; background: transparent; color: var(--muted); cursor: pointer; transition: all .15s; }
.hdr-btn:hover { border-color: var(--c1); color: var(--c1); }

.tabs { display: flex; max-width: 980px; margin: 0 auto 2rem; }
.tab { font-family: 'DM Mono', monospace; font-size: 12px; letter-spacing: 0.05em; padding: 7px 24px; border: 1.5px solid var(--border); background: transparent; color: var(--muted); cursor: pointer; transition: all .15s; text-transform: uppercase; }
.tab + .tab { margin-left: -1.5px; }
.tab:first-child { border-radius: 4px 0 0 4px; }
.tab:last-child { border-radius: 0 4px 4px 0; }
.tab.active { background: var(--accent); color: var(--bg); border-color: var(--accent); z-index: 1; }
.tab:hover:not(.active) { background: var(--surface); color: var(--text); }

.matrix-container { max-width: 980px; margin: 0 auto; }
.axis-header { display: flex; margin-bottom: 6px; padding-left: 36px; gap: 10px; }
.axis-col { flex: 1; text-align: center; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.axis-col.urgent { color: var(--c1); font-weight: 500; }
.matrix-body { display: flex; align-items: stretch; }
.y-axis { width: 36px; flex-shrink: 0; display: flex; flex-direction: column; gap: 10px; }
.y-label { flex: 1; display: flex; align-items: center; justify-content: center; }
.y-label span { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); writing-mode: vertical-rl; transform: rotate(180deg); white-space: nowrap; }
.y-label.important span { color: var(--c2); font-weight: 500; }
.matrix-grid { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.quadrant { border-radius: 8px; padding: 1rem; display: flex; flex-direction: column; min-height: 220px; border: 1.5px solid transparent; transition: box-shadow .2s; }
.quadrant:hover { box-shadow: 0 3px 20px rgba(0,0,0,0.09); }
.q1 { background: var(--c1-bg); border-color: var(--c1-mid); }
.q2 { background: var(--c2-bg); border-color: var(--c2-mid); }
.q3 { background: var(--c3-bg); border-color: var(--c3-mid); }
.q4 { background: var(--c4-bg); border-color: var(--c4-mid); }

.q-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 5px; }
.q-tag { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 500; padding: 3px 10px; border-radius: 2px; }
.q1 .q-tag { background: var(--c1); color: #fff; }
.q2 .q-tag { background: var(--c2); color: #fff; }
.q3 .q-tag { background: var(--c3); color: #fff; }
.q4 .q-tag { background: var(--c4); color: #fff; }
.q-count { font-size: 11px; color: var(--muted); }
.q-hint { font-size: 11px; color: var(--muted); margin-bottom: 10px; }

.tasks { flex: 1; display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; min-height: 8px; }
.task { display: flex; flex-direction: column; border-radius: 5px; background: #fff; font-size: 12px; overflow: hidden; border: 1px solid rgba(0,0,0,0.08); transition: box-shadow .15s; animation: slideIn .15s ease; }
.task:hover { box-shadow: 0 1px 6px rgba(0,0,0,0.10); }
@keyframes slideIn { from { opacity:0; transform:translateY(-4px); } to { opacity:1; transform:none; } }
@keyframes fadeOut { from { opacity:1; max-height:80px; margin-bottom:6px; } to { opacity:0; max-height:0; margin-bottom:0; } }
.task.hiding { animation: fadeOut .3s ease forwards; }

.task-main { display: flex; align-items: center; gap: 8px; padding: 7px 8px 7px 10px; }
.task-main input[type=checkbox] { width: 14px; height: 14px; flex-shrink: 0; cursor: pointer; accent-color: var(--accent); }
.task-text { flex: 1; line-height: 1.4; word-break: break-word; }
.task-text.done { text-decoration: line-through; color: var(--muted); }
.task-del { background: none; border: none; cursor: pointer; color: var(--muted); font-size: 15px; padding: 0 3px; opacity: 0; transition: opacity .1s; line-height: 1; flex-shrink: 0; }
.task:hover .task-del { opacity: 1; }
.task-del:hover { color: var(--c1); }

.task-move { display: flex; gap: 5px; padding: 0 8px 7px 10px; flex-wrap: wrap; }
.move-btn { font-family: 'DM Mono', monospace; font-size: 9px; letter-spacing: 0.06em; text-transform: uppercase; padding: 2px 8px; border-radius: 20px; border: none; cursor: pointer; font-weight: 500; transition: opacity .1s, transform .1s; opacity: .75; }
.move-btn:hover { opacity: 1; transform: scale(1.05); }
.move-btn.to-do       { background: var(--c1); color: #fff; }
.move-btn.to-plan     { background: var(--c2); color: #fff; }
.move-btn.to-delegate { background: var(--c3); color: #fff; }
.move-btn.to-eliminate{ background: var(--c4); color: #fff; }

.add-row { display: flex; gap: 5px; }
.add-row input { flex: 1; min-width: 0; font-family: 'DM Mono', monospace; font-size: 16px; padding: 6px 10px; border: 1px solid rgba(0,0,0,0.12); border-radius: 4px; background: rgba(255,255,255,.7); color: var(--text); outline: none; transition: border-color .15s, background .15s; }
.add-row input:focus { border-color: rgba(0,0,0,0.3); background: #fff; }
.add-row input::placeholder { color: var(--muted); }
.add-row button { font-family: 'DM Mono', monospace; font-size: 16px; width: 36px; flex-shrink: 0; border: 1px solid rgba(0,0,0,0.12); border-radius: 4px; background: rgba(255,255,255,.5); color: var(--muted); cursor: pointer; transition: all .15s; }
.add-row button:hover { background: rgba(0,0,0,0.08); color: var(--text); }

@media (max-width: 600px) {
  #app { padding: 1rem 0.75rem 3rem; }
  header { flex-direction: column; align-items: flex-start; }
  .logo { font-size: 1.6rem; }
  .header-right { align-items: flex-start; }
  .tabs .tab { padding: 8px 16px; font-size: 11px; }
  .axis-header { display: none; }
  .matrix-body { flex-direction: column; }
  .y-axis { display: none; }
  .matrix-grid { grid-template-columns: 1fr; gap: 8px; }
  .quadrant { min-height: unset; }
  .move-btn { font-size: 11px; padding: 5px 12px; }
  .task-main { padding: 10px 10px 10px 12px; }
  .task-main input[type=checkbox] { width: 18px; height: 18px; }
  .task-move { padding: 0 10px 10px 12px; gap: 6px; }
  .add-row input { padding: 9px 12px; }
  .add-row button { width: 44px; font-size: 20px; }
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-logo">md <span>hower</span></div>
  <div class="login-sub">Eisenhowerova matice</div>
  <button class="google-btn" onclick="signIn()">
    <svg viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.2l6.8-6.8C35.8 2.5 30.2 0 24 0 14.6 0 6.6 5.4 2.7 13.3l7.9 6.1C12.5 13 17.8 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v8.5h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17z"/><path fill="#FBBC05" d="M10.6 28.6A14.8 14.8 0 0 1 9.5 24c0-1.6.3-3.2.8-4.6l-7.9-6.1A23.9 23.9 0 0 0 0 24c0 3.9.9 7.5 2.7 10.7l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.2 0 11.4-2 15.2-5.5l-7.5-5.8c-2 1.4-4.6 2.2-7.7 2.2-6.2 0-11.5-4.2-13.4-9.8l-7.9 6.1C6.6 42.6 14.6 48 24 48z"/></svg>
    Přihlásit se přes Google
  </button>
</div>

<!-- APP -->
<div id="app">
  <header>
    <div class="logo">md <span>hower</span></div>
    <div class="header-right">
      <div class="date-display" id="date-display"></div>
      <div class="header-btns">
        <div class="user-info">
          <img class="user-avatar" id="user-avatar" src="" alt="">
          <span id="user-name"></span>
        </div>
        <div class="sync-status"><div class="sync-dot loading" id="sync-dot"></div><span id="sync-label">připojování…</span></div>
        <button class="hdr-btn" onclick="clearPeriod()">Vymazat vše</button>
        <button class="hdr-btn" onclick="signOut()">Odhlásit</button>
      </div>
    </div>
  </header>

  <div class="tabs">
    <button class="tab active" onclick="switchPeriod('day',this)">Den</button>
    <button class="tab" onclick="switchPeriod('week',this)">Týden</button>
    <button class="tab" onclick="switchPeriod('month',this)">Měsíc</button>
  </div>

  <div class="matrix-container">
    <div class="axis-header">
      <div class="axis-col urgent">⚡ Urgentní</div>
      <div class="axis-col">Neurgentní</div>
    </div>
    <div class="matrix-body">
      <div class="y-axis">
        <div class="y-label important"><span>Důležité</span></div>
        <div class="y-label"><span>Méně důl.</span></div>
      </div>
      <div class="matrix-grid">
        <div class="quadrant q1">
          <div class="q-head"><span class="q-tag">Dělej hned</span><span class="q-count" id="cnt-do">0</span></div>
          <div class="q-hint">Důležité + urgentní</div>
          <div class="tasks" id="list-do"></div>
          <div class="add-row"><input id="inp-do" placeholder="Přidat úkol…" onkeydown="if(event.key==='Enter')addTask('do')"><button onclick="addTask('do')">+</button></div>
        </div>
        <div class="quadrant q2">
          <div class="q-head"><span class="q-tag">Naplánuj</span><span class="q-count" id="cnt-plan">0</span></div>
          <div class="q-hint">Důležité + neurgentní</div>
          <div class="tasks" id="list-plan"></div>
          <div class="add-row"><input id="inp-plan" placeholder="Přidat úkol…" onkeydown="if(event.key==='Enter')addTask('plan')"><button onclick="addTask('plan')">+</button></div>
        </div>
        <div class="quadrant q3">
          <div class="q-head"><span class="q-tag">Deleguj</span><span class="q-count" id="cnt-delegate">0</span></div>
          <div class="q-hint">Urgentní + méně důležité</div>
          <div class="tasks" id="list-delegate"></div>
          <div class="add-row"><input id="inp-delegate" placeholder="Přidat úkol…" onkeydown="if(event.key==='Enter')addTask('delegate')"><button onclick="addTask('delegate')">+</button></div>
        </div>
        <div class="quadrant q4">
          <div class="q-head"><span class="q-tag">Eliminuj</span><span class="q-count" id="cnt-eliminate">0</span></div>
          <div class="q-hint">Neurgentní + méně důležité</div>
          <div class="tasks" id="list-eliminate"></div>
          <div class="add-row"><input id="inp-eliminate" placeholder="Přidat úkol…" onkeydown="if(event.key==='Enter')addTask('eliminate')"><button onclick="addTask('eliminate')">+</button></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, signOut as fbSignOut, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, setDoc, onSnapshot }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCgURIPgUTxv558TA7hCkexxs5z3vB0Uuc",
  authDomain: "mdhower-7bcb8.firebaseapp.com",
  projectId: "mdhower-7bcb8",
  storageBucket: "mdhower-7bcb8.firebasestorage.app",
  messagingSenderId: "1097260986215",
  appId: "1:1097260986215:web:c1929cf33d81e8494fc9c2"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();

const QS = ['do','plan','delegate','eliminate'];
const QLABELS = { do:'Dělej hned', plan:'Naplánuj', delegate:'Deleguj', eliminate:'Eliminuj' };
let current = 'day';
let data = { day: empty(), week: empty(), month: empty() };
let saving = false;
let unsubscribe = null;
let currentUser = null;

function empty() { return { do:[], plan:[], delegate:[], eliminate:[] }; }

function setSyncStatus(state) {
  const dot = document.getElementById('sync-dot');
  const lbl = document.getElementById('sync-label');
  dot.className = 'sync-dot ' + state;
  lbl.textContent = state === 'ok' ? 'synchronizováno' : state === 'loading' ? 'ukládám…' : 'offline';
}

// Hide both screens until auth state is known
document.getElementById('login-screen').style.display = 'none';
document.getElementById('app').style.display = 'none';

onAuthStateChanged(auth, user => {
  if (user) {
    currentUser = user;
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    document.getElementById('user-name').textContent = user.displayName || user.email;
    document.getElementById('user-avatar').src = user.photoURL || '';
    startSync(user.uid);
  } else {
    currentUser = null;
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('app').style.display = 'none';
    if (unsubscribe) { unsubscribe(); unsubscribe = null; }
  }
});

function startSync(uid) {
  if (unsubscribe) unsubscribe();
  const docRef = doc(db, 'users', uid);
  unsubscribe = onSnapshot(docRef, snap => {
    if (saving) return;
    if (snap.exists()) {
      const r = snap.data();
      data = { day: r.day || empty(), week: r.week || empty(), month: r.month || empty() };
      render();
    }
    setSyncStatus('ok');
  }, () => setSyncStatus('err'));
}

async function saveData() {
  if (!currentUser) return;
  saving = true;
  setSyncStatus('loading');
  try {
    await setDoc(doc(db, 'users', currentUser.uid), { day: data.day, week: data.week, month: data.month });
    setSyncStatus('ok');
  } catch(e) { setSyncStatus('err'); }
  saving = false;
}

// Handle redirect result first (for mobile)
getRedirectResult(auth).then(result => {
  // handled by onAuthStateChanged
}).catch(e => console.error(e));

function isMobile() {
  return /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
}

window.signIn = async () => {
  try {
    if (isMobile()) {
      await signInWithRedirect(auth, provider);
    } else {
      const result = await signInWithPopup(auth, provider);
      console.log('popup ok', result.user.email);
    }
  } catch(e) {
    console.error('signin error', e.code, e.message);
    alert('Chyba přihlášení: ' + e.code + ' - ' + e.message);
    try { await signInWithRedirect(auth, provider); } catch(e2) { console.error(e2); }
  }
};
window.signOut = async () => {
  if (confirm('Odhlásit se?')) await fbSignOut(auth);
};

function render() {
  QS.forEach(q => {
    const list = document.getElementById('list-' + q);
    list.innerHTML = '';
    const tasks = data[current][q] || [];
    tasks.forEach((t, i) => {
      const el = document.createElement('div');
      el.className = 'task';
      const main = document.createElement('div');
      main.className = 'task-main';
      const chk = document.createElement('input');
      chk.type = 'checkbox'; chk.checked = t.done;
      chk.onchange = () => toggleDone(q, i, el);
      const txt = document.createElement('span');
      txt.className = 'task-text' + (t.done ? ' done' : '');
      txt.textContent = t.text;
      const del = document.createElement('button');
      del.className = 'task-del'; del.title = 'Smazat'; del.textContent = '×';
      del.onclick = () => delTask(q, i);
      main.appendChild(chk); main.appendChild(txt); main.appendChild(del);
      const moveBar = document.createElement('div');
      moveBar.className = 'task-move';
      QS.forEach(dest => {
        if (dest === q) return;
        const btn = document.createElement('button');
        btn.className = 'move-btn to-' + dest;
        btn.textContent = '→ ' + QLABELS[dest];
        btn.onclick = () => moveToQuad(q, i, dest);
        moveBar.appendChild(btn);
      });
      el.appendChild(main); el.appendChild(moveBar);
      list.appendChild(el);
    });
    document.getElementById('cnt-' + q).textContent = tasks.length;
  });
}

function moveToQuad(srcQ, i, destQ) {
  const task = data[current][srcQ].splice(i, 1)[0];
  data[current][destQ].push(task);
  saveData(); render();
}
function toggleDone(q, i, el) {
  el.classList.add('hiding');
  el.addEventListener('animationend', () => { data[current][q].splice(i, 1); saveData(); render(); }, { once: true });
}
function delTask(q, i) { data[current][q].splice(i, 1); saveData(); render(); }

window.addTask = q => {
  const inp = document.getElementById('inp-' + q);
  const val = inp.value.trim(); if (!val) return;
  data[current][q].push({ text: val, done: false });
  inp.value = ''; saveData(); render();
};
window.switchPeriod = (p, btn) => {
  current = p;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active'); render();
};
window.clearPeriod = () => {
  if (!confirm('Opravdu vymazat všechny úkoly pro toto období?')) return;
  data[current] = empty(); saveData(); render();
};

document.getElementById('date-display').textContent =
  new Date().toLocaleDateString('cs-CZ', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
</script>
</body>
</html>
